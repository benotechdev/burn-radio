    <script>
      // Safe fallback for hosted reverse-proxy environments (Google AI Studio / Cloud Run)
      // where WebSocket upgrade handshakes are closed or redirected by the proxy.
      (function() {
        // 1. Suppress unhandled promise rejection from @vite/client
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (reason && (
            (typeof reason === 'string' && (reason.includes('WebSocket') || reason.includes('@vite/client'))) ||
            (reason.message && (reason.message.includes('WebSocket') || reason.message.includes('@vite/client')))
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        // 2. Intercept console.error for [vite] websocket closed without opened
        var origConsoleError = console.error;
        console.error = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (
            msg.includes('[vite] failed to connect to websocket') ||
            msg.includes('WebSocket closed without opened')
          )) {
            // Gracefully swallow proxy HMR websocket disconnects in hosted preview
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>
